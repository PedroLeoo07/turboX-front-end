<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a1a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Car silhouette -->
  <g transform="translate(50, 100)">
    <!-- Car body -->
    <path d="M0 80 L20 80 L30 60 L80 50 L220 50 L270 60 L280 80 L300 80 L300 100 L280 100 L280 120 L260 120 L240 120 C240 130 230 140 220 140 L200 140 C190 140 180 130 180 120 L120 120 C120 130 110 140 100 140 L80 140 C70 140 60 130 60 120 L40 120 L20 120 L0 120 Z" fill="#ff0000" opacity="0.3"/>
    
    <!-- Car windows -->
    <path d="M40 50 L80 40 L220 40 L260 50 L240 60 L60 60 Z" fill="#333" opacity="0.5"/>
    
    <!-- Wheels -->
    <circle cx="80" cy="120" r="20" fill="#444"/>
    <circle cx="80" cy="120" r="12" fill="#666"/>
    <circle cx="220" cy="120" r="20" fill="#444"/>
    <circle cx="220" cy="120" r="12" fill="#666"/>
    
    <!-- Headlights -->
    <circle cx="280" cy="75" r="8" fill="#ffff88" opacity="0.7"/>
    <circle cx="280" cy="95" r="8" fill="#ffff88" opacity="0.7"/>
    
    <!-- Grille -->
    <rect x="270" y="70" width="10" height="30" fill="#333"/>
    <line x1="275" y1="75" x2="275" y2="95" stroke="#666" stroke-width="1"/>
    <line x1="272" y1="80" x2="278" y2="80" stroke="#666" stroke-width="1"/>
    <line x1="272" y1="85" x2="278" y2="85" stroke="#666" stroke-width="1"/>
    <line x1="272" y1="90" x2="278" y2="90" stroke="#666" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="200" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    🚗 CARRO
  </text>
  <text x="200" y="220" text-anchor="middle" fill="#444" font-family="Arial, sans-serif" font-size="12">
    Imagem não disponível
  </text>
  
  <!-- TurboX watermark -->
  <text x="350" y="280" text-anchor="end" fill="#333" font-family="Arial, sans-serif" font-size="10" opacity="0.5">
    TurboX
  </text>
</svg>
